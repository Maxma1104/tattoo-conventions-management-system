<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
    <meta
      name="description"
      content="Bilingual React and TypeScript operations prototype for tattoo studios coordinating conventions, artists, appointments, travel, orders, and finances."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tattoo Convention Operations System" />
    <meta
      property="og:description"
      content="A bilingual operations prototype for tattoo studios managing convention work in one shared system."
    />
    <title>Tattoo Convention Operations System</title>
    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
